name: HubSpot Token-Berechtigungen prüfen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/check-hubspot-scopes.yml]
permissions:
  contents: read
jobs:
  scopes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Nur Token-Metadaten abrufen (keine CRM-Datensätze)
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request, urllib.error
          token = os.environ.get('HUBSPOT_TOKEN', '')
          if not token:
              raise SystemExit('HUBSPOT_TOKEN fehlt')
          request = urllib.request.Request(
              'https://api.hubapi.com/oauth/v2/private-apps/get/access-token-info',
              data=json.dumps({'tokenKey': token}).encode(),
              headers={'Content-Type': 'application/json', 'Accept': 'application/json', 'Authorization': 'Bearer ' + token},
              method='POST')
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  info = json.load(response)
          except urllib.error.HTTPError as error:
              try:
                  fallback = urllib.request.Request('https://api.hubapi.com/oauth/v1/access-tokens/' + token)
                  with urllib.request.urlopen(fallback, timeout=45) as response:
                      info = json.load(response)
              except Exception:
                  raise SystemExit('Token-Metadaten nicht verfügbar; keine Datensätze abgefragt') from None
          except Exception:
              raise SystemExit('Token-Metadaten konnten nicht geprüft werden') from None
          scopes = info.get('scopes')
          if not isinstance(scopes, list) or not all(isinstance(s, str) and re.fullmatch(r'[a-zA-Z0-9_.:-]+', s) and s != token for s in scopes):
              raise SystemExit('Unerwartetes Format der Scope-Liste')
          print('GRANTED_SCOPES=' + json.dumps(sorted(scopes)))
          print('Keine CRM-Datensätze abgerufen.')
          PY
