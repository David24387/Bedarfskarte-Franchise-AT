name: Google My Maps Standorte synchronisieren
on:
  workflow_dispatch:
  schedule:
    - cron: '29 * * * *'
permissions:
  contents: write
concurrency:
  group: mymaps-sync-at
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: My Maps KML abrufen und in GeoJSON konvertieren
        run: python3 scripts/sync_mymaps.py
      - name: Nur Änderungen übernehmen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mymaps_standorte.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Sync AT Google My Maps locations"
            git pull --rebase origin main
            git push
          fi
