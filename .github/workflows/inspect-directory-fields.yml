name: HubSpot Standortfelder zuordnen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-directory-fields.yml]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Nur relevante Unternehmens-Felddefinitionen prüfen
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          request = urllib.request.Request('https://api.hubapi.com/crm/v3/properties/companies', headers={'Authorization': 'Bearer ' + os.environ['HUBSPOT_TOKEN']})
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  props = json.load(response)['results']
          except Exception:
              raise SystemExit('Felddefinitionen konnten nicht geladen werden') from None
          wanted = re.compile(r'phone|telefon|email|e.mail|geschäft|geschaeft|firmenbuch|ust|vat|vertrags|contract|status|oem|erm.*url|euromaster|standort|lifecycle|partner.*id|focus', re.I)
          for prop in props:
              if wanted.search(prop['name'] + ' ' + prop.get('label','')):
                  print(json.dumps({key:prop.get(key) for key in ['name','label','type','fieldType','options']}, ensure_ascii=False))
          PY
