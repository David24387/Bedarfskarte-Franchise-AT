name: Synthetic directory tests
on:
  push:
    paths: ['index.html', 'directory.js', 'tests/**', '.github/workflows/directory-tests.yml']
  pull_request:
    paths: ['index.html', 'directory.js', 'tests/**', '.github/workflows/directory-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/directory.test.cjs tests/integration.test.cjs
