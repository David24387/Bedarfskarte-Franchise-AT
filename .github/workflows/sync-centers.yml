name: Public-Partner für AT-Bedarfskarte aus HubSpot synchronisieren

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_hubspot_at.py
      - .github/workflows/sync-centers.yml
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: center-sync-at
  cancel-in-progress: false

jobs:
  sync:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export mit synthetischen Daten prüfen
        run: python -m unittest discover -s scripts -p 'test_sync_hubspot_at.py'

      - name: Ausschließlich Public-Partner vollständig aus HubSpot laden
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python scripts/sync_hubspot_at.py --audience public

      - name: Public-Standortliste sofort veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten.csv standorte.json export_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync public Austria partners from HubSpot"
            git pull --rebase origin main
            git push
          fi

      - name: Fahrzeitflächen für neue Partner ergänzen
        id: coverage
        timeout-minutes: 3
        continue-on-error: true
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python -u build_isochronen.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isochronen.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen im AT-Leistungsverzeichnis."
          else
            git commit -m "Sync public Austria partners and coverage from HubSpot"
            git pull --rebase origin main
            git push
          fi

      - name: Fehlende Fahrzeitflächen melden
        if: steps.coverage.outcome == 'failure'
        run: |
          echo "Standortdaten synchronisiert; fehlende Fahrzeitflächen werden im nächsten Lauf erneut berechnet."
          exit 1
