name: Öffentliche AT-Partner aus HubSpot synchronisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: center-sync-at
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Öffentliche Partner vollständig aus HubSpot laden
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python scripts/sync_hubspot_at.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten.csv
          if git diff --cached --quiet; then
            echo "Keine Änderungen im AT-Leistungsverzeichnis."
          else
            git commit -m "Sync public Austria partners from HubSpot"
            git pull --rebase origin main
            git push
          fi
