name: Franchise-AT aus Google Sheet synchronisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: center-sync-at
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Google Sheet als daten.csv laden
        env:
          SHEET_ID: 178Jk-HSNF1pHHxuLRPGaaLOvc7snxp8KUrVrSXJ0yCo
        run: |
          set -euo pipefail
          URL="https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv"
          curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 20 --max-time 120 "$URL" -o daten.csv.new
          test -s daten.csv.new
          python - <<'PY'
          import csv
          with open('daten.csv.new', encoding='utf-8-sig', newline='') as f:
              rows=list(csv.reader(f))
          if len(rows) < 2:
              raise SystemExit('Export enthält keine Franchise-Daten')
          print(f'Google-Sheet-Export geladen: {len(rows)-1} Datenzeilen')
          PY
          mv daten.csv.new daten.csv

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten.csv
          if git diff --cached --quiet; then
            echo "Keine Änderungen im AT-Leistungsverzeichnis."
          else
            git commit -m "Sync Austria franchise centers from Google Sheet"
            git pull --rebase origin main
            git push
          fi
