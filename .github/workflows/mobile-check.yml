name: Mobile map interactions
on:
  push:
    branches: [main]
    paths: ['index.html', 'app.js', 'directory.js', 'tests/mobile-smoke.cjs', '.github/workflows/mobile-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Test phone and tablet layouts
        run: |
          python -m http.server 8765 >/tmp/map-server.log 2>&1 &
          node tests/mobile-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screenshots
          path: mobile-screenshots/
